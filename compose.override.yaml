services:
  database:
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${PMA_PORT:-8081}:80"
